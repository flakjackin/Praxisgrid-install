name: praxisgrid

services:
  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ${PRAXISGRID_IMAGE_PREFIX:-ghcr.io/flakjackin/praxisgrid}-backend:${PRAXISGRID_TAG:-0.3.2}
    restart: unless-stopped
    environment:
      PRAXISGRID_DATABASE: /data/praxisgrid.db
      AUTH_CREDENTIALS_FILE: /data/admin-credentials.json
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?missing from PraxisGrid environment file}
      SESSION_SECRET: ${SESSION_SECRET:?missing from PraxisGrid environment file}
      PROVIDER_ENCRYPTION_KEY: ${PROVIDER_ENCRYPTION_KEY:?missing from PraxisGrid environment file}
      SECURE_COOKIE: ${SECURE_COOKIE:-false}
      PRAXISGRID_EMBEDDED_WORKER: "false"
      PRAXISGRID_ALLOW_SELF_SIGNUP: ${PRAXISGRID_ALLOW_SELF_SIGNUP:-false}
      PRAXISGRID_DEPLOYMENT_MODE: compose
      PRAXISGRID_RUNNER_IMAGE: ${PRAXISGRID_IMAGE_PREFIX:-ghcr.io/flakjackin/praxisgrid}-runner:${PRAXISGRID_TAG:-0.3.2}
      PRAXISGRID_PREVIEW_ORIGIN_TEMPLATE: ${PRAXISGRID_PREVIEW_ORIGIN_TEMPLATE:-}
    volumes:
      - ${PRAXISGRID_DATA_ROOT:-/var/lib/praxisgrid}/data:/data
      - ${PRAXISGRID_DATA_ROOT:-/var/lib/praxisgrid}/workspace:/workspace:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3011/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24

  runner:
    build:
      context: ../..
      dockerfile: Dockerfile.runner
    image: ${PRAXISGRID_IMAGE_PREFIX:-ghcr.io/flakjackin/praxisgrid}-runner:${PRAXISGRID_TAG:-0.3.2}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PRAXISGRID_DATABASE: /data/praxisgrid.db
      PROVIDER_ENCRYPTION_KEY: ${PROVIDER_ENCRYPTION_KEY:?missing from PraxisGrid environment file}
      PRAXISGRID_DEPLOYMENT_MODE: compose
      PRAXISGRID_RUNNER_ID: ubuntu-runner
      PRAXISGRID_RUNNER_NAME: Ubuntu host runner
      PRAXISGRID_ENABLE_PREVIEWS: ${PRAXISGRID_ENABLE_PREVIEWS:-true}
      # Backend reaches the dev-server port over this Compose network.
      PRAXISGRID_PREVIEW_ADVERTISE_HOST: auto
      PRAXISGRID_PREVIEW_LIMIT: ${PRAXISGRID_PREVIEW_LIMIT:-3}
      # Named rather than inferred. A runner with no slug resolves the only
      # organization when there is exactly one, which is true of every fresh
      # install -- and stops being true the moment somebody signs up and
      # founds a second one, which this deployment's own sign-up offers. The
      # runner then registers degraded and claims nothing, so every board on
      # the host stops, for a reason visible only on the Runners page. k8s
      # names it for this reason; the one-host install did not.
      #
      # `praxisgrid` is the slug of the home organization AuthManager creates
      # from PRAXISGRID_ORGANIZATION (default "PraxisGrid"). Override it in
      # the environment file if this host's work lives somewhere else.
      PRAXISGRID_ORGANIZATION_SLUG: ${PRAXISGRID_ORGANIZATION_SLUG:-praxisgrid}
      PRAXISGRID_WORKER_CONCURRENCY: ${PRAXISGRID_WORKER_CONCURRENCY:-2}
      PRAXISGRID_WORKTREE_ROOT: /workspace/worktrees
      PRAXISGRID_TOOL_ROOT: /workspace/tools
      PRAXISGRID_LOG_LEVEL: INFO
      # Docker's default confinement can prevent Codex from creating its own
      # bubblewrap sandbox. Keep the secure failure as the default. An
      # operator who accepts this runner container as the boundary can opt in
      # explicitly; the install and acceptance docs spell out the consequence.
      PRAXISGRID_CODEX_SANDBOX_MODE: ${PRAXISGRID_CODEX_SANDBOX_MODE:-}
      # Where the Android device is, when this host was installed with one.
      # The runner reads it as ADB_SERVER_SOCKET, so its own adb becomes a
      # client of that container's adb server and sees an ordinary
      # `emulator-5554` -- every command it already issues (`exec-out
      # screencap`, `install`, `shell input`) works with no special casing.
      # Empty is the ordinary case and means this runner boots or attaches to
      # nothing; the preview then fails with a message naming the three ways
      # to give it a device.
      PRAXISGRID_ADB_SERVER_SOCKET: ${PRAXISGRID_ADB_SERVER_SOCKET:-}
    networks:
      - default
      - emulator
    volumes:
      - ${PRAXISGRID_DATA_ROOT:-/var/lib/praxisgrid}/data:/data
      - ${PRAXISGRID_DATA_ROOT:-/var/lib/praxisgrid}/credentials:/credentials
      - ${PRAXISGRID_DATA_ROOT:-/var/lib/praxisgrid}/workspace:/workspace
      - ${PRAXISGRID_DATA_ROOT:-/var/lib/praxisgrid}/repos:/workspace/repos

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: ${PRAXISGRID_IMAGE_PREFIX:-ghcr.io/flakjackin/praxisgrid}-frontend:${PRAXISGRID_TAG:-0.3.2}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - ${PRAXISGRID_PORT:-8080}:80

  # An Android device for the emulator preview surface. Off unless this host
  # was installed with --emulator.
  #
  # It is a separate container for the reason k8s/android-emulator.yaml gives,
  # which is the credential boundary rather than image size: an emulator is a
  # virtual machine, it needs /dev/kvm, and the runner is the container that
  # mounts every identity's vendor CLI logins, every repository checkout and
  # the control-plane database. Putting the device beside it keeps the
  # privilege and the credentials apart -- this container mounts nothing and
  # holds no secret, so what /dev/kvm is granted to is one throwaway Android
  # image.
  android-emulator:
    profiles: ["emulator"]
    build:
      context: ../..
      dockerfile: Dockerfile.emulator
    image: ${PRAXISGRID_IMAGE_PREFIX:-ghcr.io/flakjackin/praxisgrid}-emulator:${PRAXISGRID_TAG:-0.3.2}
    restart: unless-stopped
    # Built from the checkout, never pulled. It is ~4 GB of Android system
    # image, it is optional, and a deployment with no Android work should not
    # fetch it -- so it is published with none of the other three, and the
    # installer refuses --emulator from the published payload, which carries
    # no Dockerfiles. This is also why the installer's `pull` overrides
    # COMPOSE_PROFILES: a pull must not ask the registry for this tag.
    #
    # `devices:` rather than `privileged:`. The Kubernetes manifest is
    # privileged because a bare k3s node has no device plugin to ask for
    # /dev/kvm; Docker hands over the device node itself, which is the grant
    # that was wanted without everything else that comes with privileged.
    devices:
      - /dev/kvm:/dev/kvm
    environment:
      # The AVD baked into the image at build time. Overriding it here only
      # makes sense alongside an image built with that AVD.
      PRAXISGRID_EMULATOR_AVD: ${PRAXISGRID_EMULATOR_AVD:-pg36}
    # Deliberately no `ports:`. adb authenticates nobody over TCP, so what
    # keeps this device private is that it sits on a network only the runner
    # joins -- the Compose analogue of that manifest's NetworkPolicy.
    # Publishing 5037 would offer a root shell on it to the whole LAN.
    networks:
      - emulator
    # A ceiling, not a reservation, mirroring the Kubernetes limits. One
    # device booting must not starve the agent CLIs the runner is holding;
    # PRAXISGRID_WORKER_CONCURRENCY is 2, and a vendor CLI in a long session
    # is not small.
    cpus: "4"
    mem_limit: 8g
    # Booted, not merely listening. The Kubernetes readiness probe is a TCP
    # check on 5037, which passes as soon as the adb server binds -- seconds
    # in, with 30-90 s of cold AVD boot still to go, which is exactly the
    # window in which a preview would attach and find nothing there.
    # `sys.boot_completed` is the device's own answer to the question.
    healthcheck:
      test: ["CMD-SHELL", "adb shell getprop sys.boot_completed 2>/dev/null | grep -q 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

networks:
  # Only the runner and the device are on it, which is the whole of what keeps
  # an unauthenticated adb private here. The runner keeps `default` as well,
  # because that is where the rest of the deployment is.
  emulator:
